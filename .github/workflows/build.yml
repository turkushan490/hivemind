name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # The runtime image carries the training stack (~16 GB); the runner's preinstalled tools must make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      # The version the app reports (/api/health): the tag without its "v" on a release, else 0.9.<run number>.
      - id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "release=$(node -p "require('./package.json').version")-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_RELEASE=${{ steps.ver.outputs.release }}
          # The 16 GB base is too big for the GitHub cache: only HiveMind's own small stages are cached.
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # Build the built-in speech engine (whisper.cpp) for Windows, so the .exe carries it. Static CPU build = one self-contained .exe.
  whisper-win:
    runs-on: windows-latest
    steps:
      - name: Build whisper.cpp (Windows)
        shell: bash
        run: |
          git clone --depth 1 -b v1.7.4 https://github.com/ggerganov/whisper.cpp whisper.cpp
          cmake -B build -S whisper.cpp -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release --target whisper-cli
          mkdir out
          find build -name 'whisper-cli.exe' -exec cp {} out/ \;
          find build -path '*Release*' -name '*.dll' -exec cp {} out/ \; || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-win
          path: out

  # HiveMind for Windows: one self-contained .exe (the same server + web UI + built-in whisper, minus the Linux-only Colibri/training/Kokoro).
  # Built on every main push as an artifact (to catch breakage early) and attached to the GitHub Release on a version tag.
  windows-exe:
    needs: [test, whisper-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The built-in speech engine (whisper.cpp) built on the Windows runner, baked into the exe below.
      - uses: actions/download-artifact@v4
        with:
          name: whisper-win
          path: server/whisper-bin
      # The version the exe reports (/api/health): the tag without its "v", else 0.9.<run number>.
      - id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "release=$(node -p "require('./package.json').version")-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi
      # Build the web UI and the server, bake the UI + version + whisper binary into the exe bundle, then pack a single Windows .exe.
      - run: npm run build
      - run: npm run embed:web -w server
        env:
          APP_RELEASE: ${{ steps.ver.outputs.release }}
      - run: npm run embed:bin -w server
      - run: npm run build:exe -w server
      - name: Pack single .exe
        # --no-bytecode --public: ship plain JS, not V8 bytecode (bytecode fatally crashes this bundle at runtime).
        run: npx @yao-pkg/pkg@6.25.0 server/dist-exe/hivemind.mjs -t node24-win-x64 --no-bytecode --public --public-packages "*" -o hivemind-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: hivemind-windows-x64
          path: hivemind-windows-x64.exe
      - name: Attach to the GitHub Release (on a version tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: hivemind-windows-x64.exe
